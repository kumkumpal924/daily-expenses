<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - Daily Expenses</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
<div class="auth-wrap">
<section class="auth-brand">
<div class="brand"><span class="brand-mark">₹</span><span>Daily Expenses</span></div>
<div>
<h1>Know where every rupee goes.</h1>
<p>Log your daily spending, set a monthly budget and save towards your goals. Your data stays private to your account.</p>
</div>
<small>Personal spending dashboard</small>
</section>
<section class="auth-panel">
<form class="auth-card" id="loginForm" novalidate>
<h2>Welcome back</h2>
<p class="auth-sub">Log in to see your expenses.</p>
<div class="auth-error" id="authError" role="alert" hidden></div>
<label>Username<input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
<label>Password<span class="pw-field"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" data-pw="password">Show</button></span></label>
<button type="submit" class="primary-button wide" id="submitBtn">Log in</button>
<p class="auth-switch" id="switchLine" hidden>New here? <a href="/signup.html">Create an account</a></p>
</form>
</section>
</div>
<script src="/auth.js"></script>
</body>
</html>
