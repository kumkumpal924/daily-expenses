spring.datasource.url=jdbc:mysql://localhost:3306/daily_expenses?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080

# ---- Login / admin settings ----
# The first time the app starts, an admin account is created with these details.
# Log in with them, then change the password from the sidebar (Change password).
app.admin.name=Administrator
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# Set to false if only the admin should create accounts (hides the public Sign up page).
app.signup.enabled=true
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
